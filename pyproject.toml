[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memledger"
version = "0.1.0"
description = "Provenance-governed memory for long-running AI agents (AEGIS 2026, team Prompt Stars)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "cryptography>=42", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27"]  # fastapi/httpx: tests/console
store = ["chromadb>=0.5"]
models = ["transformers>=4.44", "torch", "sentence-transformers", "datasets", "accelerate>=0.26",
          "sentencepiece", "protobuf",  # DeBERTa-v3 tokenizer
          "vllm; sys_platform == 'linux'"]  # vLLM serves the agent LLM on Brev; Macs use Ollama
demo = ["streamlit"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]  # the console: python -m web

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # top-level bench/ attacks/ scenarios/ eval/ are importable in tests

[tool.setuptools.packages.find]
include = ["memledger*"]
